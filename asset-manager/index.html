<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <title>マネープラン診断</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="資産プラン">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#ffffff">
  <style>
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --border: #e8edf5;
      --text: #1a2236;
      --sub: #6b7a99;
      --accent: #6c63ff;
      --accent2: #a78bfa;
      --green: #22c55e;
      --yellow: #f59e0b;
      --red: #ef4444;
      --shadow: 0 2px 16px rgba(108,99,255,.10);
      --shadow-sm: 0 1px 6px rgba(0,0,0,.07);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', sans-serif;
      background: var(--bg); color: var(--text); min-height: 100vh; }
    #app {
      max-width: 680px; margin: 0 auto;
      padding: calc(20px + env(safe-area-inset-top)) 16px calc(60px + env(safe-area-inset-bottom));
    }

    /* Header */
    .logo { text-align: center; margin-bottom: 6px; }
    .logo .icon { font-size: 2.2rem; display: block; margin-bottom: 2px; }
    .logo h1 { font-size: 1.55rem; font-weight: 800; color: var(--accent); letter-spacing: -.02em; }
    .logo p { font-size: .82rem; color: var(--sub); margin-top: 2px; }

    /* Stepper */
    .stepper { display: flex; gap: 5px; margin: 18px 0 6px; }
    .step-dot { flex: 1; height: 4px; border-radius: 999px; background: var(--border); transition: background .3s; }
    .step-dot.done { background: var(--accent); }
    .step-dot.active { background: var(--accent2); }
    .step-lbl { text-align: center; font-size: .76rem; color: var(--sub); margin-bottom: 14px; }

    /* Card */
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 18px;
      padding: 22px; margin-bottom: 14px; box-shadow: var(--shadow-sm); }
    .card h2 { font-size: 1.05rem; font-weight: 700; color: var(--text); margin-bottom: 3px; }
    .card .hint { font-size: .78rem; color: var(--sub); line-height: 1.6; margin-bottom: 16px; margin-top: 4px; }

    /* Form */
    label { display: block; font-size: .8rem; font-weight: 600; color: var(--sub); margin: 14px 0 5px; }
    label:first-of-type { margin-top: 0; }
    .req { color: var(--red); font-size: .7rem; margin-left: 3px; }
    .input-wrap { position: relative; }
    .input-wrap .sfx { position: absolute; right: 13px; top: 50%; transform: translateY(-50%);
      color: var(--sub); font-size: .84rem; pointer-events: none; }
    input, select {
      width: 100%; background: var(--bg); border: 1.5px solid var(--border); border-radius: 12px;
      color: var(--text); padding: 11px 14px; font-size: 16px; transition: border-color .2s;
      -webkit-appearance: none; appearance: none;
    }
    input:focus, select:focus { outline: none; border-color: var(--accent); background: #fff; }
    .input-wrap input { padding-right: 40px; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    @media(max-width:500px){ .row3{grid-template-columns:1fr 1fr;} }

    /* Checkbox toggle */
    .toggle { display: flex; align-items: center; gap: 10px; margin-top: 14px; cursor: pointer; }
    .toggle input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--accent); cursor: pointer; }
    .toggle span { font-size: .84rem; color: var(--text); }

    /* Buttons */
    .btn { background: var(--accent); color: #fff; border: none; border-radius: 14px;
      padding: 15px 24px; font-size: 16px; font-weight: 700; cursor: pointer; min-height: 52px;
      width: 100%; transition: transform .1s, box-shadow .1s; box-shadow: 0 4px 14px rgba(108,99,255,.35); }
    .btn:active { transform: scale(.98); }
    .btn.sec { background: var(--bg); color: var(--text); box-shadow: var(--shadow-sm); border: 1.5px solid var(--border); }
    .btn.ghost { background: transparent; color: var(--sub); border: 1.5px solid var(--border); box-shadow: none; }
    .btn-row { display: flex; gap: 12px; margin-top: 16px; }
    .restart { text-align: center; margin-top: 10px; }
    .restart a { color: var(--sub); font-size: .78rem; cursor: pointer; }

    /* Family */
    .member { display: grid; grid-template-columns: 1.3fr 1fr 1fr auto; gap: 8px; align-items: end; margin-bottom: 8px; }
    .member .del { background: #fef2f2; color: var(--red); border: none; border-radius: 10px; padding: 11px 13px; cursor: pointer; font-size: 14px; }

    /* Stats */
    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
    .stat { background: var(--card); border: 1.5px solid var(--border); border-radius: 16px;
      padding: 16px; box-shadow: var(--shadow-sm); }
    .stat .lbl { font-size: .73rem; color: var(--sub); font-weight: 600; margin-bottom: 5px; text-transform: uppercase; letter-spacing: .04em; }
    .stat .val { font-size: 1.45rem; font-weight: 800; color: var(--text); line-height: 1.1; }
    .stat .sub { font-size: .71rem; color: var(--sub); margin-top: 4px; }
    .stat.accent { border-color: var(--accent); background: #f0efff; }
    .stat.accent .val { color: var(--accent); }
    .stat.green { border-color: #bbf7d0; background: #f0fdf4; } .stat.green .val { color: var(--green); }
    .stat.yellow { border-color: #fde68a; background: #fffbeb; } .stat.yellow .val { color: var(--yellow); }
    .stat.red { border-color: #fecaca; background: #fef2f2; } .stat.red .val { color: var(--red); }

    /* Progress bar */
    .prog-wrap { background: var(--bg); border-radius: 999px; height: 10px; overflow: hidden; margin: 8px 0; }
    .prog-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width .8s; }
    .prog-lbls { display: flex; justify-content: space-between; font-size: .71rem; color: var(--sub); }

    /* Alert */
    .alert { border-radius: 12px; padding: 13px 16px; margin-bottom: 14px; font-size: .86rem; line-height: 1.6; font-weight: 500; }
    .alert.green { background: #dcfce7; color: #166534; }
    .alert.yellow { background: #fef9c3; color: #854d0e; }
    .alert.blue { background: #eff6ff; color: #1e40af; }

    /* Chart */
    .chart-wrap { position: relative; width: 100%; }
    .chart-wrap svg { display: block; }
    .chart-tip { position: absolute; background: var(--text); color: #fff; border-radius: 10px;
      padding: 9px 12px; font-size: .78rem; pointer-events: none; white-space: nowrap;
      box-shadow: 0 4px 16px rgba(0,0,0,.2); display: none; z-index: 10; line-height: 1.7; }
    .chart-tip.show { display: block; }

    /* Legend */
    .legend { display: flex; flex-wrap: wrap; gap: 10px 18px; margin-bottom: 12px; }
    .legend-item { display: flex; align-items: center; gap: 6px; font-size: .76rem; color: var(--sub); }
    .legend-dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }

    /* Advice */
    .advice { display: flex; gap: 13px; padding: 14px 0; border-bottom: 1.5px solid var(--bg); }
    .advice:last-child { border-bottom: none; }
    .advice .ic { font-size: 1.5rem; flex-shrink: 0; line-height: 1; margin-top: 2px; }
    .advice h3 { font-size: .9rem; font-weight: 700; margin-bottom: 4px; color: var(--text); }
    .advice p { font-size: .8rem; color: var(--sub); line-height: 1.6; }
    .advice .impact { font-size: .75rem; color: var(--accent); margin-top: 5px; font-weight: 700; }
    .tag { display: inline-block; border-radius: 999px; padding: 1px 10px; font-size: .7rem; font-weight: 700; margin-right: 5px; }
    .tag.red { background: #fef2f2; color: var(--red); }
    .tag.yellow { background: #fffbeb; color: #b45309; }
    .tag.blue { background: #eff6ff; color: #1d4ed8; }
    .tag.green { background: #f0fdf4; color: #15803d; }

    /* Section title */
    .sec-title { font-size: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--sub); margin-bottom: 12px; }

    /* income chart axis */
    .ax { font-size: 10px; fill: #94a3b8; }
  </style>
</head>
<body>
<div id="app"></div>
<div class="chart-tip" id="tip"></div>

<script>
// ============ 業種別年収カーブ ============
const AGE_BANDS = [22,27,32,37,42,47,52,57];
const BASE = {22:270,27:390,32:460,37:520,42:580,47:630,52:670,57:680};
const INDUSTRIES = {
  "IT・通信":1.30,"コンサル":1.45,"金融・保険":1.30,"総合商社":1.55,
  "メーカー（製造）":1.10,"医療・製薬":1.20,"建設・不動産":1.10,
  "公務員":1.00,"小売・サービス":0.85,"教育":0.95,"マスコミ・広告":1.20,"その他":1.00
};
function curveIncome(age, industry){
  const mult = INDUSTRIES[industry] ?? 1.0;
  const a = Math.max(22, Math.min(59, age));
  let lo = AGE_BANDS[0], hi = AGE_BANDS[AGE_BANDS.length-1];
  for(let i=0;i<AGE_BANDS.length-1;i++) if(a>=AGE_BANDS[i]&&a<=AGE_BANDS[i+1]){lo=AGE_BANDS[i];hi=AGE_BANDS[i+1];break;}
  if(a<=AGE_BANDS[0]){lo=hi=AGE_BANDS[0];} if(a>=AGE_BANDS[AGE_BANDS.length-1]){lo=hi=AGE_BANDS[AGE_BANDS.length-1];}
  const t = hi===lo?0:(a-lo)/(hi-lo);
  return (BASE[lo]+(BASE[hi]-BASE[lo])*t)*mult;
}

// ============ Utils ============
function fmtY(n){ n=Math.round(n);
  if(Math.abs(n)>=1e8) return (n/1e8).toFixed(2)+'億';
  if(Math.abs(n)>=1e4) return Math.round(n/1e4).toLocaleString()+'万円';
  return n.toLocaleString()+'円';
}
function man(n){ return Math.round(n/1e4); }
function el(id){ return document.getElementById(id); }

// ============ State ============
const LS='moneyplan_v2';
function load(){ try{return JSON.parse(localStorage.getItem(LS))||{};}catch{return{};} }
function save(s){ try{localStorage.setItem(LS,JSON.stringify(s));}catch{} }

let S = Object.assign({
  age:32, gender:'男性', currentAssets:3403,
  income:500, industry:'IT・通信', raiseMode:'curve', raiseRate:2, retireAge:65,
  monthlySaving:50000, monthlyNisa:50000, monthlyTokutei:30000, monthlyCrypto:10000, zaikei:20000,
  insurance:15000, insuranceType:'掛け捨て',
  retNisa:5, retTokutei:5, retCrypto:10, retCash:0.1,
  flowGrowsWithIncome:true,
  targetAmount:10000, targetAge:40,
  family:[],
}, load());

let step = S._step || 0;
const STEPS = ['基本情報','収入・キャリア','資産・投資','保険・固定費','家族','目標'];

// ============ コミュニティ（スレッド共有・デモ：端末内保存） ============
const LS_THREADS='moneyplan_threads_v1';
let nav = 'diagnose';        // 'diagnose' | 'community'
let openThreadId = null;     // 開いているスレッドID

function loadThreads(){
  try{ const t=JSON.parse(localStorage.getItem(LS_THREADS)); if(t&&t.length) return t; }catch{}
  return seedThreads();
}
function saveThreads(t){ try{localStorage.setItem(LS_THREADS,JSON.stringify(t));}catch{} }
function seedThreads(){
  const seed=[
    {id:'t1', nick:'さくら', ts:Date.now()-86400000*2,
     title:'30歳・3000万。FIREしたいけど投資配分どう？',
     msg:'地方在住メーカー勤務です。暗号資産が多めなのが不安…アドバイスください！',
     snap:{age:30,industry:'メーカー（製造）',income:480,currentAssets:3000,targetAmount:8000,targetAge:45,
       monthlyNisa:50000,monthlyTokutei:20000,monthlyCrypto:40000,monthlySaving:30000,zaikei:0,reach:'46歳3ヶ月'},
     comments:[{nick:'ぽんた',ts:Date.now()-86400000,body:'暗号資産の比率が高めですね。コアをオルカンに寄せると安定すると思います。'}]},
    {id:'t2', nick:'たかし', ts:Date.now()-3600000*5,
     title:'40歳1億まであと一歩。財形やめるべき？',
     msg:'財形に月3万入れてますが利回りほぼ0。NISAに回すか迷ってます。',
     snap:{age:36,industry:'金融・保険',income:720,currentAssets:5200,targetAmount:10000,targetAge:40,
       monthlyNisa:80000,monthlyTokutei:50000,monthlyCrypto:0,monthlySaving:40000,zaikei:30000,reach:'41歳8ヶ月'},
     comments:[]},
  ];
  saveThreads(seed); return seed;
}
let THREADS = loadThreads();

function timeAgo(ts){
  const d=Date.now()-ts, m=Math.floor(d/60000), h=Math.floor(d/3600000), day=Math.floor(d/86400000);
  if(day>0) return day+'日前'; if(h>0) return h+'時間前'; if(m>0) return m+'分前'; return 'たった今';
}
function ensureNick(){
  if(S.nickname) return S.nickname;
  const n=prompt('コミュニティで使うニックネームを入力してください','');
  if(n && n.trim()){ S.nickname=n.trim().slice(0,16); save(S); }
  return S.nickname;
}
function escapeHtml(s){ return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// ============ Simulation ============
function projectIncome(age){
  if(age > S.retireAge) return 0;
  if(S.raiseMode==='manual') return S.income * Math.pow(1+S.raiseRate/100, age-S.age);
  const cur = curveIncome(S.age, S.industry), fut = curveIncome(age, S.industry);
  return S.income * (fut / Math.max(cur,1));
}

function simulate(){
  const target = S.targetAmount * 1e4;
  const endAge = Math.max(S.targetAge, S.age) + 8;
  const flowN=S.monthlyNisa, flowT=S.monthlyTokutei, flowC=S.monthlyCrypto, flowCash=S.monthlySaving+S.zaikei;
  const flowAll = flowN+flowT+flowC+flowCash || 1;
  // 初期資産を各バケット比率で配分
  const init = S.currentAssets*1e4;
  let nisa = init*(flowN/flowAll), tok = init*(flowT/flowAll);
  let crypto = init*(flowC/flowAll), cash = init*(flowCash/flowAll);

  const rows=[], income_rows=[];
  let reachExact=null;
  for(let age=S.age; age<=endAge; age++){
    const total = nisa+tok+crypto+cash;
    rows.push({age, nisa:Math.round(nisa), tok:Math.round(tok), crypto:Math.round(crypto), cash:Math.round(cash), total:Math.round(total)});
    income_rows.push({age, income:Math.round(projectIncome(age))});
    if(total>=target && reachExact===null) reachExact=age;
    // scale by income growth
    let scale=1;
    if(S.flowGrowsWithIncome){
      const i0=projectIncome(S.age), iN=projectIncome(age);
      scale = i0>0 ? Math.max(0.3,iN/i0) : 1;
    }
    if(age>=S.retireAge) scale=0;
    nisa   = nisa  *(1+S.retNisa/100)   + flowN*12*scale;
    tok    = tok   *(1+S.retTokutei/100)+ flowT*12*scale;
    crypto = crypto*(1+S.retCrypto/100) + flowC*12*scale;
    cash   = cash  *(1+S.retCash/100)   + flowCash*12*scale;
  }
  // 精密到達（月単位）
  let reachExactFine=null;
  { let n=init*(flowN/flowAll),t=init*(flowT/flowAll),c=init*(flowC/flowAll),ca=init*(flowCash/flowAll);
    for(let m=0;m<(endAge-S.age)*12;m++){
      const age=S.age+m/12;
      let sc=1;
      if(S.flowGrowsWithIncome){const i0=projectIncome(S.age),iN=projectIncome(age);sc=i0>0?Math.max(0.3,iN/i0):1;}
      if(age>=S.retireAge) sc=0;
      n=n*(1+S.retNisa/100/12)+flowN*sc; t=t*(1+S.retTokutei/100/12)+flowT*sc;
      c=c*(1+S.retCrypto/100/12)+flowC*sc; ca=ca*(1+S.retCash/100/12)+flowCash*sc;
      if(n+t+c+ca>=target){reachExactFine=age+1/12;break;}
    }
  }
  const blendRet = (flowN*S.retNisa+flowT*S.retTokutei+flowC*S.retCrypto)/(flowN+flowT+flowC||1);
  return {rows, income_rows, reachExact:reachExactFine, target, blendRet};
}

// ============ Advice ============
function genAdvice(sim){
  const A=[]; const onTrack=sim.reachExact!==null&&sim.reachExact<=S.targetAge;
  const target=sim.target; const yearsLeft=S.targetAge-S.age;
  if(S.zaikei>0) A.push({ic:'🔁',tag:'red',tagL:'見直し',title:'財形貯蓄は投資へ振り替えを',
    body:`財形に月${fmtY(S.zaikei)}。金利はほぼ0%です。この資金をNISAインデックスに回すと複利で大きく変わります。`,
    impact:`長期で+${fmtY(S.zaikei*12*yearsLeft*S.retNisa/100*yearsLeft/2)}程度の差`});
  if(S.insuranceType==='貯蓄型'||S.insuranceType==='両方ある') A.push({ic:'🛡️',tag:'yellow',tagL:'要確認',title:'貯蓄型保険の利回りを確認',
    body:`貯蓄型は手数料が高く実質利回り1%前後のことが多いです。保障は掛け捨てで確保し、差額を投資に回しましょう。`});
  if(S.monthlyNisa*12<1200000) A.push({ic:'🏦',tag:'red',tagL:'優先',title:'NISAつみたて枠を埋める',
    body:`年間枠120万円（月10万）に対して現在月${fmtY(S.monthlyNisa)}。あと月${fmtY(Math.max(0,100000-S.monthlyNisa))}増やせます。特定口座より先に優先を。`});
  if(!onTrack){
    const r=sim.blendRet/100/12, n=yearsLeft*12;
    const ff=n>0?((Math.pow(1+r,n)-1)/r):1;
    const idx=Math.min(yearsLeft,sim.rows.length-1);
    const needExtra=ff>0?Math.max(0,(target-(sim.rows[idx]?.total||0))/ff):0;
    A.push({ic:'📈',tag:'red',tagL:'優先',title:'毎月の投資額を増やす',
      body:`${S.targetAge}歳時点で目標に届かない見込み。あと月${fmtY(needExtra)}ほど追加投資できれば達成ペースに乗れます。`});
  }
  const flowInv=S.monthlyNisa+S.monthlyTokutei+S.monthlyCrypto;
  if(flowInv>0&&S.monthlyCrypto/flowInv>0.2) A.push({ic:'⚠️',tag:'yellow',tagL:'リスク',title:'暗号資産の比率が高め',
    body:`投資のうち暗号資産が${Math.round(S.monthlyCrypto/flowInv*100)}%。コアは全世界株インデックス、暗号はサテライト5〜10%目安が安定します。`});
  A.push({ic:'💼',tag:'blue',tagL:'参考',title:`${S.industry}の年収カーブ`,
    body:`${S.industry}の平均カーブでは${S.targetAge}歳時点で年収約${Math.round(projectIncome(S.targetAge))}万円と推定。昇進・転職で年収を上げると貯蓄率が直接改善します。`});
  if(S.currentAssets*1e4<3000000) A.push({ic:'💧',tag:'yellow',tagL:'重要',title:'生活防衛資金を先に確保',
    body:`まず生活費6ヶ月分を現金で確保。暴落時に投資を崩さずに済みます。`});
  const kids=S.family.filter(m=>m.rel==='子ども');
  if(kids.length>0) A.push({ic:'🎓',tag:'blue',tagL:'計画',title:'教育費の準備',
    body:`子ども${kids.length}人分。大学まで1人あたり約1,000万円が目安。資産目標とは別枠で計画的に準備しましょう。`});
  return A;
}

// ============ Chart Helpers ============
const COLORS = { nisa:'#6c63ff', tok:'#34d399', crypto:'#f59e0b', cash:'#94a3b8' };
const LABELS = { nisa:'NISA', tok:'特定口座', crypto:'暗号資産', cash:'現金・財形' };

function makeSVGChart(sim){
  const rows=sim.rows, target=sim.target;
  const W=Math.min((el('app').clientWidth||340)-44,640), H=260;
  const PL=60,PR=14,PT=22,PB=32, cW=W-PL-PR, cH=H-PT-PB;
  const maxV=Math.max(target*1.08,...rows.map(r=>r.total));
  const minA=rows[0].age, maxA=rows[rows.length-1].age;
  const xs=a=>PL+(a-minA)/(maxA-minA)*cW;
  const ys=v=>PT+cH-(v/maxV)*cH;

  // stacked area paths (bottom to top: cash, tok, crypto, nisa)
  const stacks=['cash','tok','crypto','nisa'];
  function stackedPts(keys){
    return rows.map(r=>{
      const s=keys.reduce((a,k)=>a+r[k],0);
      return `${xs(r.age).toFixed(1)},${ys(s).toFixed(1)}`;
    });
  }
  function areaPath(topKeys, botKeys){
    const top=stackedPts(topKeys);
    const bot=botKeys.length?stackedPts(botKeys):[...rows].map(r=>`${xs(r.age).toFixed(1)},${(PT+cH).toFixed(1)}`);
    return `M ${top.join(' L ')} L ${[...bot].reverse().join(' L ')} Z`;
  }
  const areas=[
    {keys:['cash'],             bot:[],             color:COLORS.cash},
    {keys:['cash','tok'],       bot:['cash'],        color:COLORS.tok},
    {keys:['cash','tok','crypto'], bot:['cash','tok'], color:COLORS.crypto},
    {keys:['cash','tok','crypto','nisa'], bot:['cash','tok','crypto'], color:COLORS.nisa},
  ];

  // grid
  const yticks=[0,.25,.5,.75,1];
  const grid=yticks.map(f=>{const v=maxV*f,y=ys(v).toFixed(1);
    return `<line x1="${PL}" y1="${y}" x2="${(PL+cW).toFixed(1)}" y2="${y}" stroke="#e8edf5" stroke-width="1"/>
      <text x="${PL-6}" y="${(+y+3.5).toFixed(1)}" class="ax" text-anchor="end">${man(v).toLocaleString()}万</text>`;}).join('');

  // x ticks
  const step2=Math.ceil(rows.length/8);
  const xticks=rows.filter((r,i)=>i%step2===0||r.age===S.targetAge).map(r=>
    `<text x="${xs(r.age).toFixed(1)}" y="${(PT+cH+16).toFixed(1)}" class="ax" text-anchor="middle">${r.age}</text>`).join('');

  // reference lines
  const refY=ys(target).toFixed(1);
  const tgX=xs(S.targetAge).toFixed(1);
  const refs=`<line x1="${PL}" y1="${refY}" x2="${(PL+cW).toFixed(1)}" y2="${refY}" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="${(PL+cW).toFixed(1)}" y="${(+refY-5).toFixed(1)}" class="ax" text-anchor="end" fill="#b45309" font-weight="bold">目標 ${man(target).toLocaleString()}万</text>
    <line x1="${tgX}" y1="${PT}" x2="${tgX}" y2="${(PT+cH).toFixed(1)}" stroke="#6c63ff" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="${tgX}" y="${(PT-6).toFixed(1)}" class="ax" text-anchor="middle" fill="#6c63ff" font-weight="bold">${S.targetAge}歳</text>`;

  // hit area (invisible rect for mouse/touch)
  const hitRect=`<rect id="chartHit" x="${PL}" y="${PT}" width="${cW.toFixed(1)}" height="${cH.toFixed(1)}" fill="transparent" style="cursor:crosshair"/>`;

  const paths=areas.map(a=>`<path d="${areaPath(a.keys,a.bot)}" fill="${a.color}" fill-opacity=".72"/>`).join('');
  // total line
  const totalLine=`<path d="M ${rows.map(r=>`${xs(r.age).toFixed(1)},${ys(r.total).toFixed(1)}`).join(' L ')}" stroke="#1a2236" stroke-width="2" fill="none"/>`;

  const svg=`<svg width="${W}" height="${H}" id="assetSvg" style="overflow:visible">
    <defs>
      <clipPath id="cp"><rect x="${PL}" y="${PT}" width="${cW}" height="${cH}"/></clipPath>
    </defs>
    <g clip-path="url(#cp)">${paths}${totalLine}</g>
    ${grid}${xticks}${refs}${hitRect}
  </svg>`;

  // Store data for tooltip
  window._chartData={rows,xs,ys,maxV,PL,PT,cH,cW,W,minA,maxA};
  return {svg,W,H};
}

function initChartTooltip(){
  const hit=el('chartHit'); const tip=el('tip');
  if(!hit||!tip) return;
  const d=window._chartData;
  function showTip(clientX, rect){
    const x=clientX-rect.left;
    const age=d.minA+(x-d.PL)/d.cW*(d.maxA-d.minA);
    const idx=Math.max(0,Math.min(d.rows.length-1,Math.round(age-d.minA)));
    const r=d.rows[idx];
    if(!r) return;
    const total=r.nisa+r.tok+r.crypto+r.cash;
    tip.className='chart-tip show';
    tip.innerHTML=`<strong>${r.age}歳時点</strong><br>
      <span style="color:${COLORS.nisa}">■</span> NISA: ${fmtY(r.nisa)}<br>
      <span style="color:${COLORS.tok}">■</span> 特定口座: ${fmtY(r.tok)}<br>
      <span style="color:${COLORS.crypto}">■</span> 暗号資産: ${fmtY(r.crypto)}<br>
      <span style="color:${COLORS.cash}">■</span> 現金・財形: ${fmtY(r.cash)}<br>
      <strong>合計: ${fmtY(total)}</strong>`;
    const svgEl=el('assetSvg');
    const svgRect=svgEl.getBoundingClientRect();
    const dotX=d.xs(r.age), dotY=d.ys(total);
    let tx=svgRect.left+dotX+10; const ty=svgRect.top+dotY-20;
    if(tx+180>window.innerWidth) tx=svgRect.left+dotX-195;
    tip.style.left=tx+'px'; tip.style.top=ty+'px';
  }
  hit.addEventListener('mousemove',e=>{ showTip(e.clientX, el('assetSvg').getBoundingClientRect()); });
  hit.addEventListener('mouseleave',()=>{ tip.className='chart-tip'; });
  hit.addEventListener('touchmove',e=>{ e.preventDefault(); showTip(e.touches[0].clientX, el('assetSvg').getBoundingClientRect()); },{passive:false});
  hit.addEventListener('touchend',()=>{ setTimeout(()=>{tip.className='chart-tip';},1500); });
}

function makeIncomeChart(income_rows){
  const rows=income_rows.filter(r=>r.income>0);
  if(!rows.length) return '<p style="color:var(--sub);font-size:.8rem">退職済みのため表示なし</p>';
  const W=Math.min((el('app').clientWidth||340)-44,640), H=160;
  const PL=56,PR=14,PT=16,PB=28, cW=W-PL-PR, cH=H-PT-PB;
  const maxV=Math.max(...rows.map(r=>r.income))*1.1;
  const barW=Math.max(2, cW/rows.length-2);
  const xs=(_,i)=>PL+i*(cW/rows.length)+barW/2;
  const ys=v=>PT+cH-(v/maxV)*cH;
  const grid=[0,.5,1].map(f=>{const v=maxV*f,y=ys(v).toFixed(1);
    return `<line x1="${PL}" y1="${y}" x2="${(PL+cW).toFixed(1)}" y2="${y}" stroke="#e8edf5"/>
      <text x="${PL-5}" y="${(+y+3).toFixed(1)}" class="ax" text-anchor="end">${Math.round(v)}万</text>`;}).join('');
  const curIdx=rows.findIndex(r=>r.age===S.age);
  const bars=rows.map((r,i)=>{
    const bh=Math.max(2,(r.income/maxV)*cH), by=PT+cH-bh;
    const isCur=r.age===S.age;
    const fill=isCur?'#6c63ff':`url(#incGrad)`;
    const lbl=i%Math.ceil(rows.length/8)===0||isCur?`<text x="${xs(null,i).toFixed(1)}" y="${(PT+cH+14).toFixed(1)}" class="ax" text-anchor="middle">${r.age}</text>`:'';
    return `<rect x="${(xs(null,i)-barW/2).toFixed(1)}" y="${by.toFixed(1)}" width="${barW.toFixed(1)}" height="${bh.toFixed(1)}" fill="${fill}" rx="2"/>
      ${lbl}`;}).join('');
  // current income line
  const curY=rows[curIdx]?ys(rows[curIdx].income).toFixed(1):'';
  const line=curIdx>=0?`<line x1="${PL}" y1="${curY}" x2="${(PL+cW).toFixed(1)}" y2="${curY}" stroke="#6c63ff" stroke-dasharray="4 3" stroke-width="1.2"/>
    <text x="${(PL+4).toFixed(1)}" y="${(+curY-4).toFixed(1)}" style="font-size:9px;fill:#6c63ff">現在 ${rows[curIdx].income}万</text>`:'';
  return `<svg width="${W}" height="${H}">
    <defs><linearGradient id="incGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6c63ff" stop-opacity=".6"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity=".2"/>
    </linearGradient></defs>
    ${grid}${line}${bars}
    <text x="${(PL+cW/2).toFixed(1)}" y="${H-2}" class="ax" text-anchor="middle">（年齢）</text>
  </svg>`;
}

function navBar(){

    <div onclick="nav='diagnose';openThreadId=null;render()" style="flex:1;text-align:center;padding:10px;border-radius:10px;font-size:.85rem;font-weight:700;cursor:pointer;${nav==='diagnose'?'background:#fff;color:var(--accent);box-shadow:var(--shadow-sm)':'color:var(--sub)'}">📊 マイ診断</div>
    <div onclick="nav='community';openThreadId=null;render()" style="flex:1;text-align:center;padding:10px;border-radius:10px;font-size:.85rem;font-weight:700;cursor:pointer;${nav==='community'?'background:#fff;color:var(--accent);box-shadow:var(--shadow-sm)':'color:var(--sub)'}">💬 みんなの資産</div>
  </div>`;
}
function render(){
  S._step=step; save(S);
  if(nav==='community'){ openThreadId?renderThread():renderCommunity(); window.scrollTo(0,0); return; }
  step<STEPS.length?renderWizard():renderResult();
  window.scrollTo(0,0);
}

function stepper(){
  return `<div class="stepper">${STEPS.map((_,i)=>`<div class="step-dot ${i<step?'done':i===step?'active':''}"></div>`).join('')}</div>
    <div class="step-lbl">STEP ${step+1} / ${STEPS.length}　<strong>${STEPS[step]}</strong></div>`;
}

function fld(lbl,id,val,{sfx='',type='number',ph='',req=false}={}){
  return `<label>${lbl}${req?'<span class="req"> *</span>':''}</label>
    <div class="input-wrap"><input type="${type}" id="${id}" value="${val??''}" placeholder="${ph}">
    ${sfx?`<span class="sfx">${sfx}</span>`:''}</div>`;
}
function sel(lbl,id,val,opts){
  return `<label>${lbl}</label><select id="${id}">${opts.map(o=>`<option ${o===val?'selected':''}>${o}</option>`).join('')}</select>`;
}

    ${fld('退職予定年齢','f_retireAge',S.retireAge,{sfx:'歳'})}
  </div>`;

  else if(step===2) body=`<div class="card">
    <h2>💰 毎月の貯蓄・投資</h2><p class="hint">毎月どこにいくら入れているか（月額・円）。</p>
    ${fld('現金貯金（普通預金など）','f_msave',S.monthlySaving,{sfx:'円/月'})}
    ${fld('NISA 積立','f_mnisa',S.monthlyNisa,{sfx:'円/月'})}

    ${fld('暗号資産','f_mcrypto',S.monthlyCrypto,{sfx:'円/月'})}
    ${fld('財形貯蓄','f_zaikei',S.zaikei,{sfx:'円/月'})}
    <h2 style="margin-top:20px;font-size:.95rem">📈 想定利回り（年率）</h2>
    <div class="row3">
      ${fld('NISA','f_rnisa',S.retNisa,{sfx:'%'})}
      ${fld('特定口座','f_rtok',S.retTokutei,{sfx:'%'})}
      ${fld('暗号資産','f_rcrypto',S.retCrypto,{sfx:'%'})}
    </div>
    <label class="toggle"><input type="checkbox" id="f_grow" ${S.flowGrowsWithIncome?'checked':''}>
    <span>年収UPに比例して積立額も増やす（推奨）</span></label>
  </div>`;

  else if(step===3) body=`<div class="card">
    <h2>🛡️ 保険・固定費</h2><p class="hint">保険は種類によって資産形成への影響が変わります。</p>
    ${fld('保険料の合計','f_ins',S.insurance,{sfx:'円/月'})}

  else if(step===4) body=`<div class="card">

    <button class="btn ghost" style="margin-top:12px" onclick="addMember()">＋ 家族を追加</button>

  else if(step===5) body=`<div class="card">

function renderFamily(){
  const list=el('familyList'); if(!list) return;
  if(!S.family.length){list.innerHTML=`<p style="color:var(--sub);font-size:.82rem">まだ登録されていません。</p>`;return;}
  list.innerHTML=S.family.map((m,i)=>`<div class="member">
    <div><label style="margin-top:0">続柄</label><select data-i="${i}" data-k="rel">
      ${['配偶者','子ども','親','その他'].map(o=>`<option ${o===m.rel?'selected':''}>${o}</option>`).join('')}</select></div>
    <div><label style="margin-top:0">性別</label><select data-i="${i}" data-k="gender">
      ${['男性','女性'].map(o=>`<option ${o===m.gender?'selected':''}>${o}</option>`).join('')}</select></div>
    <div><label style="margin-top:0">年齢</label><input type="number" data-i="${i}" data-k="age" value="${m.age??''}"></div>
    <button class="del" onclick="delMember(${i})">✕</button>
  </div>`).join('');
  list.querySelectorAll('select,input').forEach(inp=>inp.addEventListener('change',e=>{
    const i=+e.target.dataset.i,k=e.target.dataset.k;
    S.family[i][k]=k==='age'?(+e.target.value||0):e.target.value; save(S);}));
}
function addMember(){ collectStep(); S.family.push({rel:'配偶者',gender:'女性',age:30}); render(); }
function delMember(i){ collectStep(); S.family.splice(i,1); render(); }

function collectStep(){
  const num=id=>{const e=el(id);return e?(parseFloat(e.value.replace(/,/g,''))||0):null;};
  const v=id=>{const e=el(id);return e?e.value:null;};
  if(step===0){S.age=num('f_age')??S.age;S.gender=v('f_gender')??S.gender;S.currentAssets=num('f_assets')??S.currentAssets;}
  if(step===1){S.income=num('f_income')??S.income;S.industry=v('f_industry')??S.industry;
    S.raiseMode=v('f_raiseMode')==='昇給率を手入力'?'manual':'curve';S.raiseRate=num('f_raiseRate')??S.raiseRate;
    S.retireAge=num('f_retireAge')??S.retireAge;}
  if(step===2){S.monthlySaving=num('f_msave')??S.monthlySaving;S.monthlyNisa=num('f_mnisa')??S.monthlyNisa;
    S.monthlyTokutei=num('f_mtok')??S.monthlyTokutei;S.monthlyCrypto=num('f_mcrypto')??S.monthlyCrypto;
    S.zaikei=num('f_zaikei')??S.zaikei;S.retNisa=num('f_rnisa')??S.retNisa;S.retTokutei=num('f_rtok')??S.retTokutei;
    S.retCrypto=num('f_rcrypto')??S.retCrypto;S.flowGrowsWithIncome=el('f_grow')?el('f_grow').checked:S.flowGrowsWithIncome;}
  if(step===3){S.insurance=num('f_ins')??S.insurance;S.insuranceType=v('f_instype')??S.insuranceType;}
  if(step===5){S.targetAmount=num('f_tamount')??S.targetAmount;S.targetAge=num('f_tage')??S.targetAge;}
  save(S);
}
function nextStep(){ collectStep(); step++; render(); }
function prevStep(){ collectStep(); step--; render(); }
function resetAll(){ if(confirm('入力内容をすべて消去して最初からやり直しますか？')){localStorage.removeItem(LS);location.reload();} }

// ============ Result ============
function renderResult(){

  const atTarget=sim.rows[Math.max(0,idx)]?.total??0;
  const progress=Math.min(S.currentAssets*1e4/target*100,100);
  const advice=genAdvice(sim);
  const {svg:chartSVG}=makeSVGChart(sim);
  const incomeChartSVG=makeIncomeChart(sim.income_rows);

  const alertHtml=onTrack
    ?`<div class="alert green">✅ 現在のプランで <strong>${Math.floor(sim.reachExact)}歳${Math.round((sim.reachExact%1)*12)}ヶ月頃</strong>に目標 ${fmtY(target)} を達成見込みです！</div>`

      <div class="stat"><div class="lbl">月の投資合計</div><div class="val" style="font-size:1.15rem">${fmtY(S.monthlyNisa+S.monthlyTokutei+S.monthlyCrypto)}</div><div class="sub">想定利回り ${sim.blendRet.toFixed(1)}%</div></div>

      <div class="legend">

    </div>`;
  initChartTooltip();
}

// ============ Community ============
function snapBadges(snap){
  const inv=(snap.monthlyNisa||0)+(snap.monthlyTokutei||0)+(snap.monthlyCrypto||0);
  return `<div style="display:flex;flex-wrap:wrap;gap:6px;margin:8px 0">
    <span class="tag blue">${snap.age}歳</span>
    <span class="tag blue">${escapeHtml(snap.industry)}</span>
    <span class="tag green">資産 ${fmtY(snap.currentAssets*1e4)}</span>
    <span class="tag yellow">目標 ${fmtY(snap.targetAmount*1e4)}@${snap.targetAge}歳</span>
  </div>`;
}
function snapDetail(snap){
  const rows=[
    ['年収',`${snap.income}万円`],['月NISA',fmtY(snap.monthlyNisa||0)],
    ['月特定口座',fmtY(snap.monthlyTokutei||0)],['月暗号資産',fmtY(snap.monthlyCrypto||0)],
    ['月現金貯金',fmtY(snap.monthlySaving||0)],['月財形',fmtY(snap.zaikei||0)],
    ['達成予測',snap.reach||'-'],
  ];
  return `<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px">
    ${rows.map(([k,v])=>`<div style="background:var(--bg);border-radius:10px;padding:8px 10px"><div style="font-size:.7rem;color:var(--sub)">${k}</div><div style="font-weight:700;font-size:.86rem">${v}</div></div>`).join('')}
  </div>`;
}

function renderCommunity(){
  el('app').innerHTML=`
    <div class="logo"><span class="icon">💬</span><h1>みんなの資産</h1><p>資産プランを共有してアドバイスを送り合おう</p></div>
    ${navBar()}
    <button class="btn" onclick="nav='diagnose';render()">＋ 自分のプランを共有する（マイ診断から）</button>
    <div style="margin-top:14px">
    ${THREADS.sort((a,b)=>b.ts-a.ts).map(t=>`
      <div class="card" style="cursor:pointer" onclick="openThreadId='${t.id}';render()">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <strong style="font-size:.82rem;color:var(--accent)">${escapeHtml(t.nick)}</strong>
          <span style="font-size:.72rem;color:var(--sub)">${timeAgo(t.ts)}</span>
        </div>
        <h2 style="font-size:1rem;margin:6px 0 2px">${escapeHtml(t.title)}</h2>
        ${snapBadges(t.snap)}
        <div style="font-size:.78rem;color:var(--sub);display:flex;justify-content:space-between;align-items:center;margin-top:4px">
          <span>${escapeHtml((t.msg||'').slice(0,40))}${(t.msg||'').length>40?'…':''}</span>
          <span>💬 ${t.comments.length}</span>
        </div>
      </div>`).join('')}
    </div>`;
}

function renderThread(){
  const t=THREADS.find(x=>x.id===openThreadId);
  if(!t){ nav='community'; openThreadId=null; render(); return; }
  el('app').innerHTML=`
    ${navBar()}
    <div style="margin-bottom:12px"><a onclick="openThreadId=null;render()" style="color:var(--sub);font-size:.82rem;cursor:pointer">← スレッド一覧へ</a></div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <strong style="font-size:.85rem;color:var(--accent)">${escapeHtml(t.nick)}</strong>
        <span style="font-size:.72rem;color:var(--sub)">${timeAgo(t.ts)}</span>
      </div>
      <h2 style="font-size:1.1rem;margin:6px 0">${escapeHtml(t.title)}</h2>
      <p style="font-size:.85rem;color:var(--text);line-height:1.6">${escapeHtml(t.msg)}</p>
      ${snapBadges(t.snap)}
      ${snapDetail(t.snap)}
    </div>
    <div class="card">
      <div class="sec-title">💡 アドバイス（${t.comments.length}件）</div>
      <div id="commentList">
        ${t.comments.length?t.comments.map(c=>`
          <div class="advice"><div class="ic">💬</div><div>
            <h3>${escapeHtml(c.nick)} <span style="font-weight:400;color:var(--sub);font-size:.72rem">${timeAgo(c.ts)}</span></h3>
            <p>${escapeHtml(c.body)}</p>
          </div></div>`).join(''):'<p style="color:var(--sub);font-size:.82rem">まだアドバイスがありません。最初の一言を送りましょう！</p>'}
      </div>
      <label style="margin-top:16px">アドバイスを送る</label>
      <textarea id="commentBody" rows="3" style="width:100%;background:var(--bg);border:1.5px solid var(--border);border-radius:12px;padding:11px 14px;font-size:16px;font-family:inherit;resize:vertical" placeholder="例：暗号資産の比率を下げてオルカン中心にすると安定しますよ"></textarea>
      <button class="btn" style="margin-top:10px" onclick="postComment('${t.id}')">送信する</button>
    </div>`;
}

function postComment(id){
  const t=THREADS.find(x=>x.id===id); if(!t) return;
  const body=el('commentBody').value.trim(); if(!body){ alert('内容を入力してください'); return; }
  const nick=ensureNick(); if(!nick) return;
  t.comments.push({nick, ts:Date.now(), body:body.slice(0,500)});
  saveThreads(THREADS); render();
}

function shareCurrentPlan(){
  const nick=ensureNick(); if(!nick) return;
  const title=prompt('スレッドのタイトル（相談したいこと）','例：40歳1億まで間に合う？投資配分の相談');
  if(title===null) return;
  const msg=prompt('みんなに伝えたいこと・聞きたいこと','');
  if(msg===null) return;
  const sim=simulate();
  const reach=sim.reachExact?`${Math.floor(sim.reachExact)}歳${Math.round((sim.reachExact%1)*12)}ヶ月`:'未達';
  const t={ id:'t'+Date.now(), nick, ts:Date.now(),
    title:(title.trim()||'資産プランの相談').slice(0,60),
    msg:(msg.trim()).slice(0,400),
    snap:{age:S.age,industry:S.industry,income:S.income,currentAssets:S.currentAssets,
      targetAmount:S.targetAmount,targetAge:S.targetAge,monthlyNisa:S.monthlyNisa,
      monthlyTokutei:S.monthlyTokutei,monthlyCrypto:S.monthlyCrypto,monthlySaving:S.monthlySaving,
      zaikei:S.zaikei,reach},
    comments:[] };
  THREADS.push(t); saveThreads(THREADS);
  nav='community'; openThreadId=t.id; render();
}

render();
</script>
</body>
</html>
