<script type="text/babel">
const { useState, useMemo, useCallback } = React;
const { LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, ReferenceLine, ResponsiveContainer, Area, AreaChart, Legend } = Recharts;

// ---- Parsers ----
function parseMoneyForward(text) {
  const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
  const result = { total: 0, categories: [], monthly: { income: 0, expense: 0, saving: 0 } };

  // Try to find total asset line
  for (const line of lines) {
    const totalMatch = line.match(/総資産[^\d]*([\d,]+)/);
    if (totalMatch) {
      result.total = parseInt(totalMatch[1].replace(/,/g, ''));
    }
    const cashMatch = line.match(/現金[^\d]*([\d,]+)/);
    if (cashMatch) {
      result.categories.push({ name: '現金・預金', amount: parseInt(cashMatch[1].replace(/,/g, '')) });
    }
    const incomeMatch = line.match(/収入[^\d]*([\d,]+)/);
    if (incomeMatch) {
      result.monthly.income = parseInt(incomeMatch[1].replace(/,/g, ''));
    }
    const expenseMatch = line.match(/支出[^\d]*([\d,]+)/);
    if (expenseMatch) {
      result.monthly.expense = parseInt(expenseMatch[1].replace(/,/g, ''));
    }
  }

  // Fallback: look for any yen amounts
  if (result.total === 0) {
    const amounts = [];
    for (const line of lines) {
      const m = line.match(/([\d,]+)\s*円/g);
      if (m) {
        m.forEach(a => {
          const v = parseInt(a.replace(/[,円]/g, ''));
          if (v > 10000) amounts.push(v);
        });
      }
    }
    if (amounts.length > 0) result.total = Math.max(...amounts);
  }

  result.monthly.saving = result.monthly.income - result.monthly.expense;
  return result;
}

function parseRakuten(text) {
  const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
  const holdings = [];
  let totalAsset = 0;
  let gainLoss = 0;

  for (const line of lines) {
    // Pattern: fund/stock name + amount + gain/loss
    const holdingMatch = line.match(/(.+?)\s+([\d,]+)\s*(円|口|株)?.*?([+-]?[\d,]+)\s*(円)?/);
    const totalMatch = line.match(/(?:評価額合計|保有資産合計|合計)[^\d]*([\d,]+)/);
    const gainMatch = line.match(/(?:損益合計|損益)[^\d]*([+-]?[\d,]+)/);

    if (totalMatch) {
      totalAsset = parseInt(totalMatch[1].replace(/,/g, ''));
    }
    if (gainMatch) {
      gainLoss = parseInt(gainMatch[1].replace(/,/g, ''));
    }
    if (holdingMatch && !totalMatch && !gainMatch && line.length < 200) {
      const amt = parseInt(holdingMatch[2].replace(/,/g, ''));
      if (amt > 1000) {
        holdings.push({
          name: holdingMatch[1].substring(0, 30),
          amount: amt,
          gain: 0
        });
      }
    }
  }

  return { totalAsset, gainLoss, holdings: holdings.slice(0, 10) };
}

function formatYen(n) {
  if (n >= 100000000) return `${(n / 100000000).toFixed(2)}億円`;
  if (n >= 10000) return `${Math.round(n / 10000).toLocaleString()}万円`;
  return `${n.toLocaleString()}円`;
}

function formatM(n) {
  return `${Math.round(n / 10000).toLocaleString()}万`;
}

// ---- Roadmap Calculation ----
function calcRoadmap(currentAge, currentAssets, monthlySaving, annualReturn) {
  const TARGET = 100000000;
  const r = annualReturn / 100 / 12;
  const data = [];
  let assets = currentAssets;

  for (let age = currentAge; age <= 45; age++) {
    for (let m = 0; m < 12; m++) {
      assets = assets * (1 + r) + monthlySaving;
    }
    data.push({ age, assets: Math.round(assets), target: age === 40 ? TARGET : null });
    if (age >= 44 && assets >= TARGET) break;
  }

  // Find when 100M is reached
  let reachAge = null;
  let tempAssets = currentAssets;
  for (let month = 0; month < 360; month++) {
    tempAssets = tempAssets * (1 + r) + monthlySaving;
    if (tempAssets >= TARGET) {
      reachAge = currentAge + month / 12;
      break;
    }
  }

  return { data, reachAge };
}

function generateAdvice(currentAssets, monthlySaving, annualReturn, currentAge, reachAge) {
  const advice = [];
  const TARGET = 100000000;
  const yearsLeft = 40 - currentAge;
  const gap = TARGET - currentAssets;

  if (reachAge === null || reachAge > 40) {
    const neededMonthly = Math.round(
      (TARGET - currentAssets * Math.pow(1 + annualReturn/100, yearsLeft)) /
      (((Math.pow(1 + annualReturn/100/12, yearsLeft * 12) - 1) / (annualReturn/100/12)))
    );

    advice.push({
      icon: '💰',
      title: '月間貯蓄額を増やす',
      body: `現在の月${formatYen(monthlySaving)}から増額が必要です。計算上、月${formatYen(Math.max(0, neededMonthly))}程度が目安。固定費（保険・サブスク・通信費）の見直しから始めましょう。`,
      priority: 'high'
    });
  }

  if (annualReturn < 5) {
    advice.push({
      icon: '📈',
      title: '運用利回りを高める',
      body: `現在の想定利回り${annualReturn}%は保守的です。全世界株式インデックスファンド（VT, eMAXIS Slim全世界株式等）の長期投資で歴史的に年5-7%の実績があります。`,
      priority: 'medium'
    });
  }

  advice.push({
    icon: '🏦',
    title: 'NISA・iDeCoを最大活用',
    body: '新NISAは年360万円（成長投資枠240万+つみたて枠120万）が非課税。iDeCoは掛金全額が所得控除。この2つを先に埋めてから課税口座を使いましょう。',
    priority: 'high'
  });

  if (currentAssets < 10000000) {
    advice.push({
      icon: '🛡️',
      title: '生活防衛資金を確保',
      body: '投資の前に生活費6ヶ月分を現金で確保。これがセーフティネットとなり、暴落時も投資を継続できます。',
      priority: 'medium'
    });
  }

  advice.push({
    icon: '💼',
    title: '収入源を複数持つ',
    body: '副業・フリーランス・投資収益など複数の収入源を持つことで、貯蓄率を高められます。30代は本業スキルを活かした副業が最も効率的です。',
    priority: 'low'
  });

  advice.push({
    icon: '📊',
    title: 'ポートフォリオの分散',
    body: '国内株・米国株・先進国株・債券・REIT等に分散。年齢的にはリスク資産80-90%でも許容範囲内。定期的なリバランス（年1-2回）を忘れずに。',
    priority: 'medium'
  });

  return advice;
}

// ---- Components ----
function InputSection({ onAnalyze }) {
  const [mfText, setMfText] = useState('');
  const [rakutenText, setRakutenText] = useState('');
  const [age, setAge] = useState(32);
  const [monthlySaving, setMonthlySaving] = useState(100000);
  const [annualReturn, setAnnualReturn] = useState(5);
  const [manualAssets, setManualAssets] = useState('');

  const handleSample = () => {
    setMfText(`総資産 3,250,000円
現金・預金 1,200,000円
収入 420,000円
支出 280,000円
投資信託 2,050,000円`);
    setRakutenText(`eMAXIS Slim 全世界株式 1,200,000円
eMAXIS Slim 米国株式(S&P500) 600,000円
日本株 250,000円
評価額合計 2,050,000円
損益合計 +180,000円`);
  };

  const handleAnalyze = () => {
    const mf = parseMoneyForward(mfText);
    const rakuten = parseRakuten(rakutenText);

    let totalAssets = 0;
    if (manualAssets && parseInt(manualAssets.replace(/,/g, '')) > 0) {
      totalAssets = parseInt(manualAssets.replace(/,/g, '')) * 10000;
    } else {
      totalAssets = Math.max(mf.total, rakuten.totalAsset + (mf.categories[0]?.amount || 0));
      if (totalAssets === 0 && rakuten.totalAsset > 0) totalAssets = rakuten.totalAsset;
      if (totalAssets === 0 && mf.total > 0) totalAssets = mf.total;
    }

    const monthly = monthlySaving;
    onAnalyze({
      totalAssets,
      monthly,
      annualReturn,
      age,
      mf,
      rakuten,
      holdings: rakuten.holdings
    });
  };

  return (
    <div>
      <div className="card">
        <h2>⚙️ 基本設定</h2>
        <div className="grid-2">
          <div>
            <label>現在の年齢</label>
            <input type="number" value={age} onChange={e => setAge(parseInt(e.target.value) || 30)} min="20" max="39" />
          </div>
          <div>
            <label>想定年間利回り (%)</label>
            <input type="number" value={annualReturn} onChange={e => setAnnualReturn(parseFloat(e.target.value) || 5)} min="0" max="20" step="0.5" />
          </div>
          <div>
            <label>月間貯蓄・投資額 (円)</label>
            <input type="number" value={monthlySaving} onChange={e => setMonthlySaving(parseInt(e.target.value) || 0)} step="10000" />
          </div>
          <div>
            <label>現在の総資産 (万円) ※データ貼り付け時は不要</label>
            <input type="text" value={manualAssets} onChange={e => setManualAssets(e.target.value)} placeholder="例: 500（万円で入力）" />
          </div>
        </div>
      </div>

      <div className="grid-2">
        <div className="card">
          <h2>📊 マネーフォワードのデータ</h2>
          <p style={{fontSize:'0.8rem', color:'#64748b', marginBottom:'12px'}}>
            マネーフォワードMEの資産・家計画面からテキストをコピーして貼り付け
          </p>
          <textarea
            placeholder={`例：\n総資産 3,250,000円\n現金・預金 1,200,000円\n収入 420,000円\n支出 280,000円`}
            value={mfText}
            onChange={e => setMfText(e.target.value)}
            rows={6}
          />
        </div>
        <div className="card">
          <h2>📈 楽天証券のデータ</h2>
          <p style={{fontSize:'0.8rem', color:'#64748b', marginBottom:'12px'}}>
            楽天証券の保有商品・資産合計画面からコピーして貼り付け
          </p>
          <textarea
            placeholder={`例：\neMAXIS Slim 全世界株式 1,200,000円\nS&P500 600,000円\n評価額合計 2,050,000円\n損益合計 +180,000円`}
            value={rakutenText}
            onChange={e => setRakutenText(e.target.value)}
            rows={6}
          />
        </div>
      </div>

      <div style={{textAlign:'center'}}>
        <button className="secondary" onClick={handleSample}>サンプルデータで試す</button>
        <button onClick={handleAnalyze} style={{marginLeft:'12px'}}>🚀 分析・ロードマップ生成</button>
      </div>
    </div>
  );
}

function Dashboard({ data, onReset }) {
  const [tab, setTab] = useState('roadmap');
  const { totalAssets, monthly, annualReturn, age, rakuten, holdings } = data;
  const TARGET = 100000000;
  const { data: chartData, reachAge } = useMemo(
    () => calcRoadmap(age, totalAssets, monthly, annualReturn),
    [age, totalAssets, monthly, annualReturn]
  );
  const advice = useMemo(
    () => generateAdvice(totalAssets, monthly, annualReturn, age, reachAge),
    [totalAssets, monthly, annualReturn, age, reachAge]
  );

  const progress = Math.min((totalAssets / TARGET) * 100, 100);
  const yearsLeft = 40 - age;
  const onTrack = reachAge !== null && reachAge <= 40;

  const milestones = [
    { year: age + Math.ceil(yearsLeft * 0.25), label: '第1チェックポイント', desc: `目標: ${formatYen(Math.round(TARGET * 0.15))}以上の資産形成` },
    { year: age + Math.ceil(yearsLeft * 0.5), label: '折り返し地点', desc: `目標: ${formatYen(Math.round(TARGET * 0.35))}以上。NISA満額運用中であること` },
    { year: age + Math.ceil(yearsLeft * 0.75), label: '最終加速フェーズ', desc: `目標: ${formatYen(Math.round(TARGET * 0.65))}以上。複利効果が加速` },
    { year: 40, label: '🎯 目標達成', desc: `1億円達成${onTrack ? '見込み！' : '（計画修正が必要）'}` },
  ].filter(m => m.year >= age);

  const CustomTooltip = ({ active, payload, label }) => {
    if (!active || !payload?.length) return null;
    return (
      <div style={{background:'#1e293b', border:'1px solid #334155', borderRadius:'8px', padding:'12px', fontSize:'0.82rem'}}>
        <p style={{color:'#94a3b8', marginBottom:'6px'}}>{label}歳</p>
        {payload.map((p, i) => (
          <p key={i} style={{color: p.color, fontWeight:600}}>{p.name}: {formatYen(p.value)}</p>
        ))}
      </div>
    );
  };

  return (
    <div>
      <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'20px'}}>
        <div>
          {onTrack
            ? <div className="alert success">✅ 現在のペースで{Math.floor(reachAge)}歳{Math.round((reachAge % 1) * 12)}ヶ月頃に1億円達成見込みです！</div>
            : <div className="alert warn">⚠️ 現在のペースでは40歳までに1億円達成が困難です。下記アドバイスを参考に計画を見直しましょう。</div>
          }
        </div>
        <button className="secondary" onClick={onReset} style={{marginTop:0, whiteSpace:'nowrap'}}>← 再入力</button>
      </div>

      <div className="grid-3" style={{marginBottom:'20px'}}>
        <div className={`stat-card ${onTrack ? 'success' : 'warning'}`}>
          <div className="label">現在の総資産</div>
          <div className="value">{formatYen(totalAssets)}</div>
          <div className="sub">目標まで {formatYen(Math.max(0, TARGET - totalAssets))}</div>
        </div>
        <div className="stat-card highlight">
          <div className="label">達成率</div>
          <div className="value">{progress.toFixed(1)}%</div>
          <div className="sub">1億円まで</div>
        </div>
        <div className={`stat-card ${onTrack ? 'success' : 'danger'}`}>
          <div className="label">達成予測</div>
          <div className="value">{reachAge ? `${Math.floor(reachAge)}歳${Math.round((reachAge%1)*12)}ヶ月` : '40歳超'}</div>
          <div className="sub">残り {yearsLeft}年</div>
        </div>
        <div className="stat-card">
          <div className="label">月間投資額</div>
          <div className="value">{formatYen(monthly)}</div>
          <div className="sub">年間 {formatYen(monthly * 12)}</div>
        </div>
        <div className="stat-card">
          <div className="label">想定利回り</div>
          <div className="value">{annualReturn}%</div>
          <div className="sub">年率・複利</div>
        </div>
        <div className="stat-card">
          <div className="label">含み損益（楽天）</div>
          <div className={`value ${rakuten.gainLoss >= 0 ? 'pos' : 'neg'}`} style={{color: rakuten.gainLoss >= 0 ? '#34d399' : '#f87171'}}>
            {rakuten.gainLoss >= 0 ? '+' : ''}{formatYen(rakuten.gainLoss)}
          </div>
          <div className="sub">評価損益合計</div>
        </div>
      </div>

      <div className="card" style={{marginBottom:'20px'}}>
        <div className="label" style={{marginBottom:'4px'}}>1億円達成進捗</div>
        <div className="progress-bar">
          <div className="progress-fill" style={{width:`${progress}%`}} />
        </div>
        <div style={{display:'flex', justifyContent:'space-between', fontSize:'0.75rem', color:'#64748b', marginTop:'4px'}}>
          <span>0円</span>
          <span style={{color:'#60a5fa', fontWeight:600}}>{formatYen(totalAssets)}</span>
          <span>1億円</span>
        </div>
      </div>

      <div className="tab-bar">
        {[['roadmap','📈 資産推移'], ['milestones','🗓 マイルストーン'], ['advice','💡 アドバイス'], ['holdings','💼 保有資産']].map(([key, label]) => (
          <div key={key} className={`tab ${tab === key ? 'active' : ''}`} onClick={() => setTab(key)}>{label}</div>
        ))}
      </div>

      {tab === 'roadmap' && (
        <div className="card">
          <h2>📈 資産推移シミュレーション</h2>
          <div className="chart-container">
            <ResponsiveContainer width="100%" height="100%">
              <AreaChart data={chartData} margin={{top:10, right:10, left:10, bottom:0}}>
                <defs>
                  <linearGradient id="colorAssets" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="5%" stopColor="#3b82f6" stopOpacity={0.3}/>
                    <stop offset="95%" stopColor="#3b82f6" stopOpacity={0}/>
                  </linearGradient>
                </defs>
                <CartesianGrid strokeDasharray="3 3" stroke="#1e293b" />
                <XAxis dataKey="age" stroke="#64748b" tick={{fill:'#94a3b8', fontSize:12}} tickFormatter={v => `${v}歳`} />
                <YAxis stroke="#64748b" tick={{fill:'#94a3b8', fontSize:11}} tickFormatter={v => formatM(v)+'万'} width={70} />
                <Tooltip content={<CustomTooltip />} />
                <ReferenceLine y={TARGET} stroke="#f59e0b" strokeDasharray="6 3" label={{value:'1億円', fill:'#f59e0b', fontSize:11}} />
                {reachAge && <ReferenceLine x={Math.floor(reachAge)} stroke="#34d399" strokeDasharray="6 3" label={{value:'達成', fill:'#34d399', fontSize:11}} />}
                <Area type="monotone" dataKey="assets" stroke="#3b82f6" fill="url(#colorAssets)" name="推定資産" strokeWidth={2} />
              </AreaChart>
            </ResponsiveContainer>
          </div>
          <div className="alert info" style={{marginTop:'16px'}}>
            利回り{annualReturn}%・月{formatYen(monthly)}投資を継続した場合のシミュレーションです。実際の市場は変動します。
          </div>
        </div>
      )}

      {tab === 'milestones' && (
        <div className="card">
          <h2>🗓 マイルストーン</h2>
          {milestones.map((m, i) => (
            <div className="milestone" key={i}>
              <div className="milestone-year">{m.year}歳</div>
              <div className="milestone-content">
                <h3>{m.label}</h3>
                <p>{m.desc}</p>
              </div>
            </div>
          ))}
          <div style={{marginTop:'20px'}}>
            <div className="section-title">チェックリスト</div>
            {[
              ['新NISA成長投資枠を毎年240万円活用','green'],
              ['新NISAつみたて投資枠を毎年120万円活用','green'],
              ['iDeCo掛金を上限まで拠出','green'],
              ['生活防衛資金（6ヶ月分）を確保済み','green'],
              ['インデックスファンドで長期積立','green'],
              ['支出の固定費を最適化済み','yellow'],
              ['副業・追加収入源を検討','yellow'],
            ].map(([item, color], i) => (
              <div key={i} style={{display:'flex', alignItems:'center', gap:'8px', marginBottom:'8px', fontSize:'0.85rem'}}>
                <span className={`tag ${color}`}>{color === 'green' ? '必須' : '推奨'}</span>
                <span>{item}</span>
              </div>
            ))}
          </div>
        </div>
      )}

      {tab === 'advice' && (
        <div className="card">
          <h2>💡 個別アドバイス</h2>
          {advice.map((a, i) => (
            <div className="advice-item" key={i}>
              <div className="advice-icon">{a.icon}</div>
              <div className="advice-content">
                <h3>
                  {a.priority === 'high' && <span className="tag red">優先</span>}
                  {a.priority === 'medium' && <span className="tag yellow">重要</span>}
                  {a.priority === 'low' && <span className="tag">任意</span>}
                  {a.title}
                </h3>
                <p>{a.body}</p>
              </div>
            </div>
          ))}
        </div>
      )}

      {tab === 'holdings' && (
        <div className="card">
          <h2>💼 保有資産（楽天証券）</h2>
          {holdings && holdings.length > 0 ? (
            <>
              {holdings.map((h, i) => (
                <div className="holding-row" key={i}>
                  <span className="holding-name">{h.name}</span>
                  <span className="holding-amount">{formatYen(h.amount)}</span>
                </div>
              ))}
              <div className="holding-row" style={{borderTop:'1px solid #334155', marginTop:'8px', paddingTop:'12px'}}>
                <span style={{fontWeight:700}}>評価額合計</span>
                <span className="holding-amount" style={{fontSize:'1.1rem'}}>{formatYen(rakuten.totalAsset)}</span>
              </div>
            </>
          ) : (
            <div className="empty-state">
              <div className="icon">📋</div>
              <p>楽天証券のデータが取得できませんでした。<br/>保有商品の一覧テキストを入力画面に貼り付けてください。</p>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function App() {
  const [result, setResult] = useState(null);

  return (
    <div id="root">
      <div className="header">
        <h1>資産管理 × 40歳1億円ロードマップ</h1>
        <p>楽天証券・マネーフォワードのデータを貼り付けて、あなた専用の資産計画を生成します</p>
      </div>
      {result === null
        ? <InputSection onAnalyze={setResult} />
        : <Dashboard data={result} onReset={() => setResult(null)} />
      }
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
